<!doctype html>
<html lang="en" class="dark" data-theme="mission-control" data-appearance="dark" data-accent="cyan" data-density="spacious" data-motion="enabled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAIRA — Intelligent Resource Allocation Using Reinforcement Learning</title>
    <meta name="description" content="Reinforcement Learning-based Adaptive Intelligent Resource Allocator — discrete-time OS CPU/RAM scheduling simulator with FCFS, Round Robin, Priority, Tabular Q-Learning, and TensorFlow.js DQN." />
    <meta property="og:title" content="RAIRA — Intelligent Resource Allocation Using Reinforcement Learning" />
    <meta property="og:description" content="Discrete-time OS CPU and RAM scheduling research simulator comparing FCFS, Round Robin, Priority, Tabular Q-Learning, and Deep Q-Network (DQN)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('raira_design_studio_v21');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return;
          var allowedThemes = ['mission-control', 'academic-research', 'cyber-lab', 'minimal-enterprise'];
          var allowedAccents = ['cyan', 'blue', 'violet', 'emerald'];
          var allowedDensities = ['spacious', 'compact'];
          var theme = allowedThemes.indexOf(parsed.themeId) !== -1 ? parsed.themeId : 'mission-control';
          var defaultAppearance = (theme === 'academic-research' || theme === 'minimal-enterprise') ? 'light' : 'dark';
          var parsedAppearance = (parsed.appearance === 'dark' || parsed.appearance === 'light') ? parsed.appearance : defaultAppearance;
          var appearance = theme === 'cyber-lab' ? 'dark' : parsedAppearance;
          var accent = allowedAccents.indexOf(parsed.accentColor) !== -1 ? parsed.accentColor : 'cyan';
          var density = allowedDensities.indexOf(parsed.layoutDensity) !== -1 ? parsed.layoutDensity : 'spacious';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.appearance = appearance;
          root.dataset.accent = accent;
          root.dataset.density = density;
          root.classList.toggle('dark', appearance === 'dark');
          root.style.colorScheme = appearance;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
